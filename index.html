<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글씨 탐험대</title>
<meta name="theme-color" content="#FF9F43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글씨 탐험대">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg:#FFF8EC; --card:#FFFFFF; --ink:#3B2F2A; --sub:#8A7B72; --line:#F0E2CF;
    --orange:#FF9F43; --green:#2EC4A0; --pink:#FF7EA8; --blue:#4FA8FF; --red:#FF5A5A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;cursor:pointer;border:none}
  .wrap{max-width:880px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
  header.top h1{font-size:28px;margin:0;font-weight:400}
  .savebadge{font-family:"Noto Sans KR";font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;max-width:170px;background:none;padding:10px 2px 12px;font-size:15px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav.tabs button .ic{font-size:26px;line-height:1}
  nav.tabs button.on{color:var(--ink)}
  nav.tabs button.on .ic{transform:scale(1.15)}
  .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 4px 0 var(--line);margin-bottom:16px}
  .bar{height:20px;background:#F4EADB;border-radius:999px;overflow:hidden;margin:8px 0 6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7BE0B0);border-radius:999px;transition:width .5s}
  .bar.hp i{background:linear-gradient(90deg,#FF5A5A,#FF9F43)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
  .stat b{display:block;font-size:24px;font-weight:400}
  .stat span{font-size:13px;color:var(--sub)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .pick{background:#fff;border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--line);text-align:center;border:3px solid transparent}
  .pick.new{border-color:#BFE6FF}
  .pick.up{border-color:#FFD9A8}
  .pick .tag{display:inline-block;font-size:15px;color:#fff;padding:4px 12px;border-radius:999px;margin-bottom:8px}
  .pick .chars{font-family:"Noto Sans KR";font-weight:700;font-size:30px;letter-spacing:5px;margin:6px 0 4px;word-break:keep-all}
  .boss{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
  .boss .e{font-size:84px;line-height:1;display:inline-block;animation:bob 2s ease-in-out infinite}
  .boss .dimg{width:130px;height:130px;font-size:0}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .btn{background:var(--orange);color:#fff;font-size:22px;padding:14px 22px;border-radius:18px;box-shadow:0 4px 0 #D97F25;display:inline-flex;align-items:center;gap:8px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D97F25}
  .btn.green{background:var(--green);box-shadow:0 4px 0 #1E9A7D}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 #2F7FD0}
  .btn.red{background:var(--red);box-shadow:0 4px 0 #C93F3F}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
  .btn.small{font-size:17px;padding:10px 14px;border-radius:14px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .sec-title{font-size:22px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
  .sec-title .chip{font-size:14px;color:#fff;padding:3px 10px;border-radius:999px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .mcard{background:#fff;border-radius:20px;padding:14px;text-align:left;box-shadow:0 4px 0 var(--line);border:3px solid transparent;position:relative;color:var(--ink)}
  .mcard .chars{font-size:28px;letter-spacing:4px;margin:6px 0;font-family:"Noto Sans KR";font-weight:700;word-break:keep-all}
  .mcard .t{font-size:16px;color:var(--sub)}
  .mcard .badge{display:inline-block;font-size:13px;padding:3px 9px;border-radius:999px;margin-top:2px}
  .badge.new{background:#E3F3FF;color:#1F7FD6}
  .badge.up{background:#FFF0DC;color:#C96A10}
  .mcard.done{background:#FBFFFD;border-color:#D6F3E8}
  .mcard.locked{opacity:.55}
  .mcard.gcard{border-color:#E2D6FF;background:#FCFAFF}
  .mcard.gcard .chars{letter-spacing:0;word-break:keep-all;line-height:1.35}
  .mcard.gcard.done{border-color:#D6F3E8;background:#FBFFFD}
  .steps{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .steps span{font-size:15px;padding:6px 12px;border-radius:999px;background:#F4EADB;color:var(--sub)}
  .steps span.on{background:var(--orange);color:#fff}
  /* 획순: 글꼴(학교안심 받아쓰기 B) 모양을 붓으로 칠하기 */
  .bslot{display:flex;justify-content:center;margin:4px 0 0}
  .bcell{position:relative;width:100%;max-width:330px;margin:0 auto;aspect-ratio:1;border-radius:14px;border:2px solid #D8CFC4;background:#fff;overflow:hidden}
  .bcell svg.guide{position:absolute;inset:0;width:100%;height:100%}
  .bcell canvas{position:absolute;inset:0;width:100%;height:100%}
  .bcell svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .bcell .pencil{position:absolute;font-size:26px;line-height:1;transform:translate(-4px,-26px);pointer-events:none;transition:opacity .2s}
  .bcell .bwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 200px HakgyoB,"Noto Sans KR",sans-serif;color:#E6E0D8}
  .bnum{font:700 15px "Noto Sans KR",sans-serif}
  .lchips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
  .lchips .wgrp{display:flex;gap:4px;padding:4px;border-radius:16px;background:#FFF6EA}
  .lchips button{font-family:HakgyoB,"Noto Sans KR";font-size:26px;width:50px;height:50px;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--ink)}
  .lchips button.on{border-color:#E8590C;background:#FFF0E4;color:#E8590C}
  .wlist{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .wlist div{background:#FFF8EC;border:2px solid var(--line);border-radius:16px;padding:8px 16px;display:flex;align-items:baseline;gap:8px}
  .wlist b{font-family:HakgyoB,"Noto Sans KR";font-weight:400;font-size:40px}
  .wlist span{font-size:18px;color:var(--orange)}
  .bigword{font-family:HakgyoB,"Noto Sans KR";font-size:clamp(72px,22vw,140px);line-height:1.15;text-align:center;letter-spacing:6px;color:var(--ink);background:#FFF8EC;border:2px solid var(--line);border-radius:20px;padding:8px 18px;margin:8px auto 4px;width:fit-content;max-width:100%}
  .sgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .sgrid2 figure{margin:0;text-align:center;cursor:pointer}
  .sgrid2 .bcell{max-width:none;border-radius:10px}
  .sgrid2 .pencil{font-size:18px;transform:translate(-3px,-18px)}
  .sgrid2 figcaption{font-size:13px;color:var(--sub);margin-top:2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .center{text-align:center}
  .note{font-family:"Noto Sans KR";font-size:14px;color:var(--sub);line-height:1.6}
  .cropwrap{position:relative;touch-action:none;margin:0 auto 12px;max-width:640px}
  .cropwrap canvas{width:100%;display:block;border-radius:12px}
  input[type=range]{width:100%;accent-color:var(--orange)}
  .labels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
  .labels button{font-family:"Noto Sans KR";font-weight:700;font-size:26px;min-width:64px;padding:10px 14px;border-radius:14px;background:#fff;border:3px solid var(--line);color:var(--ink)}
  .labels button.on{border-color:var(--orange);background:#FFF1E0}

  /* 스킬 카드 */
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .skill{position:relative;border-radius:18px;padding:10px 6px 10px;text-align:center;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12);overflow:hidden}
  .skill .ch{font-family:"Noto Sans KR";font-weight:700;font-size:40px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .skill .lv{font-size:15px;margin-top:2px}
  .skill .dm{font-size:13px;opacity:.95}
  .skill .xp{height:6px;background:rgba(255,255,255,.35);border-radius:999px;margin:6px 6px 0;overflow:hidden}
  .skill .xp i{display:block;height:100%;background:#fff;border-radius:999px}
  .skill .hw{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:2px solid #fff;object-fit:cover;background:#fff}
  .skill.lock{background:#EFE6D9 !important;color:#B9A996;box-shadow:0 4px 0 var(--line)}
  .skill.lock .ch{text-shadow:none;opacity:.55}
  .g1{background:linear-gradient(160deg,#8FD86F,#4CAF50)}
  .g2{background:linear-gradient(160deg,#6EC6FF,#2F86E0)}
  .g3{background:linear-gradient(160deg,#FFD54F,#FF9F1C)}
  .g4{background:linear-gradient(160deg,#FF8A65,#E53935)}
  .g5{background:linear-gradient(160deg,#C084FC,#6D28D9);animation:shine 2.4s linear infinite}
  @keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .legend span{font-size:13px;color:#fff;padding:4px 10px;border-radius:999px}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .gitem{background:#fff;border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--line);text-align:center}
  .gitem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#f6f6f6}
  .gitem b{display:block;font-family:"Noto Sans KR";font-size:18px;margin-top:4px}
  .gitem span{font-family:"Noto Sans KR";font-size:12px;color:var(--sub)}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .dino{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--line);color:var(--ink);font-family:inherit;display:block;width:100%}
  .dino:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .dino.now{border:3px solid #FFC2C2}
  .dino .e{font-size:60px;line-height:1.1;display:inline-block}
  .dino .dimg{width:100%;max-width:120px;aspect-ratio:1;display:block;margin:0 auto}
  .dino.lock .e{filter:grayscale(1) brightness(1.6) opacity(.35)}
  .dino.lock .dimg{filter:grayscale(1) blur(3px) opacity(.35)}
  .dino b{display:block;font-weight:400;font-size:17px;margin-top:4px;word-break:keep-all}
  .aura{display:inline-block;position:relative;border-radius:50%;background:radial-gradient(circle,rgba(255,70,40,0) 38%,rgba(255,70,40,.32) 56%,rgba(255,70,40,0) 71%);animation:aura 1.6s ease-in-out infinite}
  @keyframes aura{0%,100%{background-size:100% 100%}50%{background-size:112% 112%}}
  .aura{background-position:center;background-repeat:no-repeat}
  .dino .aura{display:block;max-width:120px;margin:0 auto}
  .cheer{margin:8px auto 12px;max-width:440px;border:3px solid #FFD54F;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
  .cheer.big{border-width:4px;background:linear-gradient(160deg,#FFF8D6,#FFE9B8)}
  .dmodal .aura{display:block;max-width:340px;margin:0 auto}
  .dimg{mix-blend-mode:multiply;object-fit:contain;-webkit-user-drag:none;user-select:none}
  .dmodal .big{width:100%;max-width:340px;aspect-ratio:1;display:block;margin:0 auto 6px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  .dmodal span.big{font-size:150px;line-height:1.2;width:auto;aspect-ratio:auto}
  .ddesc{font-family:"Noto Sans KR";font-size:17px;line-height:1.7;margin:6px 0 10px;word-break:keep-all;text-align:left}
  .empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:18px}
  label.fl{font-size:17px;display:block;margin:10px 0 6px}
  input.tx{font-family:"Noto Sans KR";font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);width:100%;background:#fff;color:var(--ink)}
  table.log{width:100%;border-collapse:collapse;font-family:"Noto Sans KR";font-size:14px}
  table.log th,table.log td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  table.log th{color:var(--sub);font-weight:500}
  .modal-bg{position:fixed;inset:0;background:rgba(59,47,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 8px;font-weight:400;font-size:24px}
  .pinbox{max-width:360px}
  .pins{display:flex;gap:8px;justify-content:center;margin:14px 0 18px}
  .pins span{width:42px;height:50px;border:3px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#FFFCF6}
  .pins span.ok{border-color:var(--green);color:var(--green);background:#EFFFF8}
  .pins span.bad{border-color:var(--red);color:var(--red);background:#FFF0F0}
  .pins.shake{animation:hit .4s}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{font-size:28px;padding:12px 0;border-radius:16px;background:#FFF4E2;color:var(--ink);box-shadow:0 3px 0 var(--line)}
  .pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .pad button.fn{font-size:17px;background:#fff;border:2px solid var(--line)}
  .linkbtn{background:none;color:var(--sub);font-family:"Noto Sans KR";font-size:13px;text-decoration:underline}
  .linkbtn.galbtn{font-size:15px;cursor:pointer;padding:6px 8px;display:inline-block}

  /* 결과 & 배틀 */
  .stage{position:fixed;inset:0;background:rgba(255,248,236,.97);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
  .stage h2{font-size:32px;font-weight:400;margin:6px 0}
  .stage p{font-size:19px;color:var(--sub);margin:0 0 16px}
  .ups{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0 20px}
  .upc{width:130px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
  .upc .skill{padding:14px 6px}
  .upc .skill .ch{font-size:52px}
  .upc .msg{font-size:17px;margin-top:8px}
  .upc .msg.new{color:#1F7FD6}
  .upc .msg.lv{color:#E07A00}
  @keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .arena{position:relative;width:100%;max-width:480px}
  .mon{font-size:130px;line-height:1;display:inline-block;transition:transform .1s}
  img.mon{width:min(260px,62vw);height:min(260px,62vw);display:block;margin:0 auto 6px}
  .mon.hit{animation:hit .35s}
  .mon.gone{animation:gone 1s forwards}
  @keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-16px) rotate(-8deg)}40%{transform:translateX(14px) rotate(6deg)}60%{transform:translateX(-8px)}100%{transform:translateX(0)}}
  @keyframes gone{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
  .mon.hit2{animation:hit2 .5s}
  @keyframes hit2{0%{transform:translateX(0) scale(1)}15%{transform:translateX(-26px) rotate(-14deg) scale(.92)}35%{transform:translateX(24px) rotate(12deg)}55%{transform:translateX(-14px) rotate(-6deg)}75%{transform:translateX(8px)}100%{transform:translateX(0) scale(1)}}
  .atkfx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:40px;line-height:1.25;color:#fff;-webkit-text-stroke:2px #2F86E0;text-shadow:0 4px 0 #2F86E0;white-space:nowrap;pointer-events:none;z-index:3;animation:shout 1.3s forwards}
  .atkfx.weak{-webkit-text-stroke:2px #E53935;text-shadow:0 4px 0 #E53935;font-size:46px}
  @keyframes shout{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
  .dmgnum.big{font-size:72px;color:#FFB300;-webkit-text-stroke:3px #C62828}
  .weakline{font-size:20px;margin:2px 0 6px;color:var(--ink)}
  .weakline b{display:inline-block;font-family:"Noto Sans KR";font-weight:700;font-size:26px;min-width:44px;padding:2px 8px;margin:0 3px;border-radius:12px;background:#FFE4E4;border:2px solid #FF8A8A}
  .skill.weakc{outline:4px solid #FF5A5A;outline-offset:2px}
  .skill .wtag{position:absolute;top:-2px;left:0;right:0;font-size:11px;background:#E53935;color:#fff;border-radius:10px 10px 0 0;padding:1px 0}
  .skill.weakc .ch{margin-top:10px}
  .skill .zz{position:absolute;bottom:4px;right:6px;font-size:16px}
  .skill.wordc{background:linear-gradient(160deg,#5EEAD4,#0E9F8E);width:auto !important;min-width:120px;padding:10px 14px}
  .skill.wordc .ch{font-size:34px;letter-spacing:2px}
  .sgrid.words{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .sgrid.words .skill.wordc{min-width:0}
  .weaknext{background:#FFF0F0;border:2px solid #FFC2C2;border-radius:18px;padding:10px 12px;margin:6px auto 12px;max-width:460px;font-size:18px}
  .weakcard{border:3px solid #FFC2C2;background:#FFF7F7}
  .weakcard .wchars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
  .weakcard .wchars button{font-family:"Noto Sans KR";font-weight:700;font-size:44px;min-width:86px;padding:6px 14px 4px;border-radius:18px;background:#fff;color:var(--ink);border:3px solid #FF8A8A;box-shadow:0 4px 0 #FFC2C2;display:flex;flex-direction:column;align-items:center;line-height:1.1}
  .weakcard .wchars button span{font-family:"Jua";font-weight:400;font-size:13px;color:var(--sub);margin-top:2px}
  .weakcard .wchars button:active{transform:translateY(3px);box-shadow:0 1px 0 #FFC2C2}
  .mcard .tired{display:block;font-size:12.5px;padding:5px 8px;margin:6px 0 0;line-height:1.45}
  .tired{display:inline-block;background:#EEF0FF;color:#4B4FA8;border-radius:14px;padding:6px 12px;font-size:16px;margin:6px auto}
  .tired.big{font-size:19px;padding:10px 16px;margin:0 auto 10px}
  .tired span{font-size:15px;color:#6B6FB8}
  .dmgnum{position:absolute;left:50%;top:30px;font-size:48px;color:var(--red);font-weight:400;-webkit-text-stroke:2px #fff;pointer-events:none;animation:floatup 1s forwards}
  @keyframes floatup{from{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
  .atk{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
  .atk .skill{width:96px;cursor:pointer}
  .atk .skill.used{opacity:.3;pointer-events:none;filter:grayscale(.6)}
  .atk .skill:not(.used){animation:ready 1.1s ease-in-out infinite}
  @keyframes ready{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .conf{position:fixed;top:-40px;font-size:28px;z-index:61;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:"Noto Sans KR";font-size:14px;padding:10px 16px;border-radius:999px;z-index:70;max-width:90vw;text-align:center}

const FOES = [
  {t:"dino", f:"01_koreanosaurus", n:"코리아노사우루스", d:"우리나라 전라남도 보성에서 화석이 발견된 공룡이에요. 이름에 \"코리아\"가 들어 있어요. 몸집은 작고 두 발로 빠르게 걸으며 풀을 먹었어요."},

  {t:"dino", f:"03_giganotosaurus", n:"기가노토사우루스", d:"남아메리카에 살았던 아주 큰 육식 공룡이에요. 몸길이가 티라노사우루스와 비슷하거나 조금 더 길었어요. 이름은 \"남쪽의 거대한 도마뱀\"이라는 뜻이에요."},

  {t:"dino", f:"05_therizinosaurus", n:"테리지노사우루스", d:"손톱이 어른 팔 길이만큼 길었던 공룡이에요. 무섭게 생겼지만 사실은 풀을 먹었어요. 긴 손톱으로 나뭇가지를 끌어당겨 잎을 먹었을 거예요."},
  {t:"dino", f:"06_iguanodon", n:"이구아노돈", d:"엄지손가락에 뾰족한 가시가 달린 공룡이에요. 아주 오래전에 두 번째로 이름이 붙은 공룡이라 공룡 연구의 역사에서 유명해요. 무리 지어 풀을 먹었어요."},
  {t:"dino", f:"07_diplodocus", n:"디플로도쿠스", d:"목도 길고 꼬리는 더 길었던 공룡이에요. 몸길이가 버스 2대를 이은 것보다 길었어요. 꼬리를 채찍처럼 휘둘러 적을 쫓아냈을 거예요."},
  {t:"dino", f:"08_carnotaurus", n:"카르노타우루스", d:"눈 위에 황소처럼 뿔이 두 개 난 육식 공룡이에요. 이름도 \"고기를 먹는 황소\"라는 뜻이에요. 앞발은 아주 작았지만 다리가 튼튼해서 빨리 달렸어요."},
  {t:"dino", f:"09_mosasaurus", n:"모사사우루스", d:"공룡 시대 바다에 살았던 거대한 파충류예요. 공룡은 아니지만 공룡과 같은 시대를 산 친척이에요. 지느러미로 헤엄치며 물고기와 거북을 잡아먹었어요."},
  {t:"dino", f:"10_allosaurus", n:"알로사우루스", d:"쥐라기에 살았던 사냥꾼 공룡이에요. 눈 위에 작은 뿔이 있고, 티라노보다 앞발이 길고 손가락이 세 개였어요. 티라노보다 훨씬 먼저 살았어요."},
  {t:"dino", f:"11_parasaurolophus", n:"파라사우롤로푸스", d:"머리 뒤로 길게 뻗은 관 모양의 볏이 있는 공룡이에요. 이 볏 속이 비어 있어서 나팔처럼 \"뿌우\" 소리를 내 친구들을 불렀을 거예요."},
  {t:"dino", f:"12_pachycephalosaurus", n:"파키케팔로사우루스", d:"머리뼈가 아주 두껍고 둥글게 솟아 있는 공룡이에요. 머리 둘레에는 울퉁불퉁한 혹과 작은 가시가 있어요. 박치기 공룡으로 유명해요."},

  {t:"dino", f:"14_ankylosaurus", n:"안킬로사우루스", d:"등 전체가 단단한 갑옷으로 덮인 공룡이에요. 꼬리 끝에는 망치 같은 곤봉이 있어서 육식 공룡도 함부로 덤비지 못했어요."},
  {t:"dino", f:"15_velociraptor", n:"벨로키랍토르", d:"칠면조만 한 작은 공룡이지만 아주 빠르고 똑똑했어요. 몸에 깃털이 있었고, 발에 커다란 갈고리 발톱이 있었어요."},
  {t:"dino", f:"16_spinosaurus", n:"스피노사우루스", d:"등에 커다란 돛이 달린 공룡이에요. 가장 길었던 육식 공룡 중 하나예요. 악어처럼 긴 주둥이로 물속의 커다란 물고기를 잡아먹었어요."},
  {t:"dino", f:"17_stegosaurus", n:"스테고사우루스", d:"등에 커다란 판이 두 줄로 늘어서 있고, 꼬리 끝에 뾰족한 가시가 4개 있어요. 몸은 버스만큼 컸지만 뇌는 호두만큼 작았다고 해요."},
  {t:"dino", f:"18_brachiosaurus", n:"브라키오사우루스", d:"목이 아주 길어서 4층 건물 높이의 나뭇잎까지 먹을 수 있었어요. 앞다리가 뒷다리보다 길어서 기린처럼 몸이 앞쪽으로 높았어요."},

  {t:"dino", f:"20_tyrannosaurus", n:"티라노사우루스", d:"공룡의 왕이라고 불리는 가장 유명한 육식 공룡이에요. 이빨 하나가 바나나만큼 컸고, 무는 힘이 아주 셌어요. 앞발은 짧지만 아주 튼튼했어요."},
  {t:"robot", f:"r01_kongkongball", n:"콩콩볼", d:"공에서 변신하는 꼬마 로봇이에요. 데굴데굴 굴러가다가 \"콩!\" 하고 튀어 오르면 팔다리가 쏙 나와요. 몸집은 제일 작지만 점프는 제일 잘해요."},
  {t:"robot", f:"r02_cosmo", n:"별탐사봇 코스모", d:"우주를 여행하며 반짝이는 별 조각을 모으는 탐사 로봇이에요. 등에 달린 작은 로켓으로 하늘을 날고, 가슴의 레이더로 길을 찾아요."},
  {t:"robot", f:"r03_pokri", n:"굴착대장 포크리", d:"한쪽 팔이 굴착기로 된 힘센 건설 로봇이에요. 무너진 길도 뚝딱 고치고, 무거운 바위도 번쩍 들어 올려요."},

  {t:"robot", f:"r06_syungsyungjet", n:"슝슝제트", d:"제트기에서 변신하는 하늘 로봇이에요. 날개를 등 뒤로 접으면 로봇, 펼치면 제트기가 돼요. 구름보다 빠르게 날아요."},

  {t:"robot", f:"r08_mecharex", n:"메카렉스", d:"공룡 친구 티라노사우루스를 닮은 공룡 메카 로봇이에요. 꼬리를 휘두르고 강철 이빨로 \"크아앙!\" 하고 포효해요. 공룡을 다 모은 친구에게 찾아와요."},
  {t:"robot", f:"r09_taekwonking", n:"검은띠 태권왕", d:"검은띠를 맨 태권도 로봇이에요. 돌려차기와 정권 지르기가 특기예요. 싸우기 전에는 언제나 고개 숙여 인사하는 예의 바른 무술 로봇이에요."},
  {t:"robot", f:"r10_ultraking", n:"합체킹 울트라", d:"지금까지 만난 로봇 친구들이 하나로 합체한 최강 로봇이에요. 마지막 보스예요. 이 로봇까지 친구가 되면 진짜 글씨 탐험 대장이에요!"},

  {t:"samguk", f:"s04_caocao", n:"조조", d:"위나라를 세운 똑똑하고 강한 대장이에요. 시도 잘 쓰고, 재주 있는 사람을 아주 아꼈어요. 유비 삼형제의 가장 큰 라이벌이에요."},

const customSplit = c => c.items.length > 1

function allMissions(){

/* 미션의 경험치. 예전 기록에는 xp가 없으므로 완료 횟수를 그대로 경험치로 쓴다 */
const xpOf = d => d ? (d.xp != null ? d.xp : d.count) : 0;
/* 글자별 경험치. state.xpAdj는 낱말 미션을 나눌 때 생긴 차이를 맞춰 주는 보정값(아래 migrateSplit 참고) */
function practiceMap(done, noAdj){
  done = done || state.done;
  const p = {};
  allMissions().forEach(m => { const d = done[m.id]; if (!d) return; charsOf(m).forEach(c => p[c] = (p[c]||0) + xpOf(d)); });
  if (!noAdj && state.xpAdj) Object.keys(state.xpAdj).forEach(c => { if (p[c] != null) p[c] = Math.max(0, p[c] + state.xpAdj[c]); });
  return p;
}
/* 기존 기록 옮기기 (한 번만): 여러 단어짜리 낱말 미션과 우리집 미션을 단어 하나씩 나눈 미션으로.
   예전 미션을 n번 했으면 나뉜 미션마다 n번(같은 경험치, 같은 날짜)으로 옮긴다.
   한 미션 안 두 단어에 같은 글자가 있으면(토마토, 고구마의 마) 나눈 뒤 그 글자가 두 번 세어져 레벨이 오르므로,
   옮기기 전과 뒤의 글자별 경험치 차이를 state.xpAdj에 저장해 빼 준다. 그래서 모든 글자 레벨이 그대로다. */
function migrateSplit(){
  if (state.split >= 2) return false;
  const done = state.done || {};
  // 옮기기 전 글자별 경험치 (예전 미션 구성으로 계산)
  const oldMissions = BASE.filter(m => m.cat !== "word").map(m => ({id:m.id, items:m.items}));
  Object.keys(OLD_WORD).forEach(o => oldMissions.push({id:o, items:OLD_WORD[o]}));
  if (state.name) oldMissions.push({id:"me", items:[state.name]});
  (state.custom || []).forEach(c => oldMissions.push({id:c.id, items:c.items}));
  const before = {};
  oldMissions.forEach(m => { const d = done[m.id]; if (!d) return; charsOf(m).forEach(c => before[c] = (before[c]||0) + xpOf(d)); });
  // 기록 옮기기
  const today = state.today && state.today.n ? state.today.n : null;
  const move = (oldId, newIds) => {
    const d = done[oldId];
    if (d) newIds.forEach(id => { if (!done[id]) done[id] = Object.assign({}, d, {xp: xpOf(d)}); });
    if (today && today[oldId]) newIds.forEach(id => { today[id] = today[oldId]; });
    if (newIds.indexOf(oldId) < 0){ delete done[oldId]; if (today) delete today[oldId]; }
  };
  Object.keys(OLD_WORD).forEach(o => move(o, OLD_WORD[o].map((w, k) => o + "_" + (k + 1))));
  (state.custom || []).forEach(c => { if (c.items.length > 1) move(c.id, customSplit(c).map(m => m.id)); });
  state.done = done;
  // 옮긴 뒤 글자별 경험치와 비교해서 보정값 저장
  const after = practiceMap(done, true), adj = {};
  Object.keys(after).forEach(c => { const diff = (before[c] || 0) - after[c]; if (Math.abs(diff) > 1e-9) adj[c] = diff; });
  state.xpAdj = Object.assign(state.xpAdj || {}, adj);
  state.split = 2;
  return true;
}

/* 약점 글자 고르기: 아직 안 배운 글자 먼저(무작위), 그다음 가장 오래 안 쓴 글자.
   한 미션에 약점 글자가 두 개 들어가지 않게 골라서 여러 미션을 하게 만든다 */
function charLastUsed(){
  const t = {};
  allMissions().forEach(m => { const d = state.done[m.id]; if (!d) return; charsOf(m).forEach(c => { t[c] = Math.max(t[c] || 0, d.last || 0); }); });
  return t;
}
function pickWeak(){
  const p = practiceMap(), last = charLastUsed(), ms = allMissions().map(charsOf);
  const cand = skillGroups().flatMap(g => g.chars).filter(c => ms.some(cs => cs.includes(c))).map(c => ({c, r: Math.random()}));
  cand.sort((a, b) => {
    const la = (p[a.c] || 0) > 0, lb = (p[b.c] || 0) > 0;
    if (la !== lb) return la ? 1 : -1;
    if (!la) return a.r - b.r;
    return (last[a.c] || 0) - (last[b.c] || 0) || a.r - b.r;
  });
  const together = (x, y) => ms.some(cs => cs.includes(x) && cs.includes(y));
  const picked = [];
  cand.forEach(({c}) => { if (picked.length < WEAK_COUNT && !picked.some(q => together(q, c))) picked.push(c); });
  cand.forEach(({c}) => { if (picked.length < WEAK_COUNT && !picked.includes(c)) picked.push(c); });
  return picked;
}
/* 단어 합체: 낱말 미션(내 이름 포함)의 낱말, 우리집 미션의 두 글자 이상 낱말은 합체 카드로 공격 */

function skillGroups(){
  const seen = new Set();
  const g = [
    {name:"숫자 스킬", chars:Array.from("1234567890")},
    {name:"자음 스킬", chars:Array.from("ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ")},
    {name:"모음 스킬", chars:Array.from("ㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣ")}
  ];
  g.forEach(x => x.chars.forEach(c => seen.add(c)));
  const rest = [];
  allMissions().forEach(m => charsOf(m).forEach(c => { if (!seen.has(c)){ seen.add(c); rest.push(c); } }));
  g.push({name:"글자 스킬", chars:rest});

}

function skillInfo(c, p){
  const n = (p||practiceMap())[c] || 0, lv = lvOf(n);
  const next = lv < MAXLV ? LV_NEED[lv+1] : null;

  const xp = next ? (n - prevNeed) / (next - prevNeed) : 1;
  return {c, n, lv, dmg:DMG[lv], next, left: next ? next - n : 0, xp};
}

function missionStatus(m, p){
  const cs = charsOf(m), fresh = cs.filter(c => !(p[c]));
  const avg = cs.reduce((a,c) => a + lvOf(p[c]||0), 0) / cs.length;
  return {fresh: fresh.length, avg, maxed: cs.every(c => lvOf(p[c]||0) >= MAXLV)};
}
function recommend(){
  const p = practiceMap(), all = allMissions();
  const learn = all.find(m => missionStatus(m,p).fresh > 0) || null;

    const score = s.avg * 1e13 + last;  // 레벨이 낮고 오래된 미션 우선

  });

}

/* ================= 저장소 ================= */
const Store = {
  mode:"device", db:null,
  open(){
    return new Promise((res, rej) => {
      const rq = indexedDB.open("geulssi-gw", 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        if (!d.objectStoreNames.contains("records")) d.createObjectStore("records", {keyPath:"id"});
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), st = t.objectStore(store);
      let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async init(){
    try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
    try{
      this.db = await this.open();
      const s = await this.tx("kv", "readonly", st => st.get("state"));
      const r = await this.tx("records", "readonly", st => st.getAll());
      return {s: s || null, r: r || []};
    }catch(e){
      this.db = null; this.mode = "temp";
      let s = null, r = [];
      try{ s = JSON.parse(localStorage.getItem("gw_state") || "null"); r = JSON.parse(localStorage.getItem("gw_records") || "[]"); }catch(_){}
      return {s, r};
    }
  },
  async saveState(s){
    if (this.db) return this.tx("kv", "readwrite", st => st.put(s, "state"));
    localStorage.setItem("gw_state", JSON.stringify(s));
  },
  async addRecord(r){
    if (this.db) return this.tx("records", "readwrite", st => st.put(r));
    const arr = JSON.parse(localStorage.getItem("gw_records") || "[]");
    arr.unshift(r); localStorage.setItem("gw_records", JSON.stringify(arr));
  },
  async replaceAll(s, recs){
    if (this.db){
      await this.tx("records", "readwrite", st => { st.clear(); recs.forEach(r => st.put(r)); });
      return this.tx("kv", "readwrite", st => st.put(s, "state"));
    }
    localStorage.setItem("gw_state", JSON.stringify(s)); localStorage.setItem("gw_records", JSON.stringify(recs));
  },
  async resetAll(){
    if (this.db){
      await this.tx("records", "readwrite", st => st.clear());
      return this.tx("kv", "readwrite", st => st.delete("state"));
    }
    localStorage.removeItem("gw_state"); localStorage.removeItem("gw_records");
  }
};
let chain = Promise.resolve();
function persist(){

let ac = null;
function tone(freqs, gap, type){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i*gap;
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + 0.35);
    });
  }catch(_){}
}

/* ---------- 부모 비밀번호 (6자리) ---------- */
const PIN_LEN = 6;
async function hashPin(pin){
  const msg = "geulssi-gw:" + pin;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }catch(_){
    let h = 2166136261; for (let i=0;i<msg.length;i++){ h ^= msg.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return "f" + h.toString(16);
  }
}
/* 화면 키패드: 입력한 자리에는 ✓만 보이고, 틀리면 ✗가 생긴다. '지우기'로 한 칸씩 지운다. */
function pinPad(opts){
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal pinbox">
      <h3>${esc(opts.title)}</h3>
      <p class="note" id="pinMsg">${esc(opts.text || "")}</p>
      <div class="pins" id="pins">${Array.from({length:PIN_LEN},()=>`<span></span>`).join("")}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button data-k="cancel" class="fn">취소</button><button data-k="0">0</button><button data-k="del" class="fn">⌫ 지우기</button>
      </div>
      ${opts.extra ? `<div style="margin-top:12px">${opts.extra}</div>` : ""}
    </div>`;
    document.body.appendChild(bg);
    const boxes = Array.from(bg.querySelectorAll("#pins span"));
    const msgEl = bg.querySelector("#pinMsg");
    let digits = [], wrong = false, busy = false;
    const paint = () => boxes.forEach((b,i) => {
      b.className = i < digits.length ? (wrong ? "bad" : "ok") : "";
      b.textContent = i < digits.length ? (wrong ? "✗" : "✓") : "";
    });
    const api = {
      setMsg: t => { msgEl.textContent = t; },
      fail: t => {
        wrong = true; paint(); if (t) msgEl.textContent = t;
        const pins = bg.querySelector("#pins"); pins.classList.remove("shake"); void pins.offsetWidth; pins.classList.add("shake");
      },
      clear: () => { digits = []; wrong = false; paint(); },
      close: v => { document.removeEventListener("keydown", onKey); bg.remove(); resolve(v); }
    };
    const press = async k => {
      if (busy) return;
      if (k === "cancel") return api.close(null);
      if (k === "del"){ digits.pop(); if (!digits.length) wrong = false; paint(); return; }
      if (digits.length >= PIN_LEN) return;
      digits.push(k); paint();
      if (digits.length === PIN_LEN){ busy = true; await opts.onFull(digits.join(""), api); busy = false; }
    };
    bg.querySelectorAll("[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
    const onKey = e => {
      if (/^[0-9]$/.test(e.key)) press(e.key);
      else if (e.key === "Backspace") press("del");
      else if (e.key === "Escape") press("cancel");
    };
    document.addEventListener("keydown", onKey);
    if (opts.onReady) opts.onReady(bg, api);
    paint();
  });
}
async function setupPin(isFirst){
  let first = null;
  const res = await pinPad({
    title: isFirst ? "🔑 어른 비밀번호 만들기" : "🔑 새 비밀번호 만들기",
    text: (isFirst ? "미션 완료를 확인할 때 쓸 숫자 6자리를 정해 주세요. " : "") + "아이에게 보이지 않게 입력해 주세요.",
    onFull: async (pin, api) => {
      if (!first){ first = pin; api.clear(); api.setMsg("확인을 위해 한 번 더 입력해 주세요."); return; }
      if (pin !== first){ first = null; api.fail("두 번 입력한 숫자가 달라요. 지우기를 눌러 처음부터 다시 입력해 주세요."); return; }
      api.close(pin);
    }
  });
  if (!res) return false;
  state.pinHash = await hashPin(res);
  await persist();
  toast("비밀번호를 저장했어요.");
  return true;
}

function brushCell(ch){

  if (!st){
    el.innerHTML += `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 180px HakgyoB,'Noto Sans KR';color:#CFC6BB">${esc(ch)}</div>`;
    return {el, total: 0, play(){}, step(){ return Promise.resolve(0); }, stop(){}, showAll(){}};
  }

/* 파일 저장: 공유 시트(태블릿) 또는 다운로드 */
async function saveFile(blob, filename){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: filename});
      return true;
    }
  }catch(e){ if (e && e.name === "AbortError") return false; }
  try{
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }catch(_){ return false; }
}
/* 사진 받는 칸. camera가 true면 뒷면 카메라를 바로 켜 달라고 부탁하고(capture="environment"),
   false면 지금처럼 갤러리에서 고른다. 카메라를 지원하지 않는 브라우저는 그냥 고르는 창을 연다 */
const photoInput = camera => `<input type="file" accept="image/*" class="photo-in" ${camera ? 'capture="environment" data-cam="1"' : ""} hidden>`;
function bindPhotoInputs(){
  document.querySelectorAll(".photo-in").forEach(inp => inp.onchange = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";   // 같은 사진을 다시 골라도 반응하게
    if (f) loadPhoto(f);
  });
}
function loadPhoto(file){
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const max = 1600, sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(im.naturalWidth*sc); cv.height = Math.round(im.naturalHeight*sc);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cur.img = cv; cur.crop = {cx:0.5, cy:0.5, r:0.22};
    cur.step = 4; renderPlay();
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast("사진을 열지 못했어요. 다른 사진으로 해 볼까요?"); };
  im.src = url;
}
function setupCrop(){
  const cv = document.getElementById("cropCv"), img = cur.img;
  cv.width = img.width; cv.height = img.height;
  const x = cv.getContext("2d");
  const side = () => cur.crop.r * Math.min(img.width, img.height);
  const draw = () => {
    x.drawImage(img, 0, 0);
    const s = side(), X = cur.crop.cx*img.width - s/2, Y = cur.crop.cy*img.height - s/2;
    x.fillStyle = "rgba(0,0,0,.45)";
    x.beginPath(); x.rect(0,0,img.width,img.height); x.rect(X+s,Y,-s,s); x.fill("evenodd");
    x.lineWidth = Math.max(4, img.width/180); x.strokeStyle = "#FF9F43"; x.strokeRect(X, Y, s, s);
  };
  const clamp = () => {
    const s = side(), hw = s/2/img.width, hh = s/2/img.height;
    cur.crop.cx = Math.min(1-hw, Math.max(hw, cur.crop.cx));
    cur.crop.cy = Math.min(1-hh, Math.max(hh, cur.crop.cy));
  };
  const move = e => {
    const r = cv.getBoundingClientRect();
    cur.crop.cx = (e.clientX - r.left) / r.width; cur.crop.cy = (e.clientY - r.top) / r.height;
    clamp(); draw();
  };
  let down = false;
  cv.addEventListener("pointerdown", e => { down = true; cv.setPointerCapture(e.pointerId); move(e); });
  cv.addEventListener("pointermove", e => { if (down) move(e); });
  cv.addEventListener("pointerup", () => { down = false; });
  cv.addEventListener("pointercancel", () => { down = false; });
  document.getElementById("cropSize").oninput = e => { cur.crop.r = Number(e.target.value)/100; clamp(); draw(); };
  clamp(); draw();
}
function cropImage(){
  const img = cur.img, s = cur.crop.r * Math.min(img.width, img.height);
  const X = cur.crop.cx*img.width - s/2, Y = cur.crop.cy*img.height - s/2;
  const out = document.createElement("canvas"); out.width = 220; out.height = 220;
  const x = out.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,220,220);
  x.drawImage(img, X, Y, s, s, 0, 0, 220, 220);
  return out.toDataURL("image/jpeg", 0.78);
}

async function finishMission(){
  if (!cur.label){ toast("어떤 글자인지 골라 주세요."); return; }
  const ok = await parentGate("아이가 종이에 잘 썼는지 확인했나요? 비밀번호를 넣으면 미션이 완료돼요.");
  if (!ok) return;
  const m = cur.m, now = Date.now();
  const rep = repeatOf(m.id);          // 오늘 이 미션을 몇 번째로 하는지에 따른 비율 (완료 전에 계산)
  const before = practiceMap();
  const prev = state.done[m.id];
  state.done[m.id] = {count: (prev ? prev.count : 0) + 1, last: now, xp: xpOf(prev) + rep.xp};
  countToday(m.id);
  state.events = (state.events||0) + 1;
  const after = practiceMap();
  const results = charsOf(m).map(c => ({c, lb: lvOf(before[c]||0), s: skillInfo(c, after), gain: rep.xp}));
  // 배틀 결과는 바로 계산해서 저장 (화면을 닫아도 데미지가 남도록)
  const b = state.boss || {idx:0, dmg:0};
  const weak = (b.weak || []).slice();
  const attacks = buildAttacks(m, after, rep, weak);
  const hp = bossHP(b.idx), startHP = hp - b.dmg;
  const total = attacks.reduce((a, x) => a + x.hit, 0);
  const defeated = total >= startHP;
  const mon = dinoAt(b.idx);
  state.boss = defeated ? {idx: b.idx + 1, dmg: 0, weak: []} : {idx: b.idx, dmg: b.dmg + total, weak};
  if (defeated) state.boss.weak = pickWeak();   // 다음 상대의 약점은 이 순간에 정해서 저장
  const rec = {id: "r" + now, mission: m.id, title: m.title, label: cur.label, img: cropImage(), at: now};
  records.unshift(rec);
  persist();
  chain = chain.then(() => Store.addRecord(rec)).catch(err => {
    toast(err && err.code === "quota_exceeded" ? "사진 저장 공간이 가득 찼어요." : "글씨 사진을 저장하지 못했어요.");
  });
  showSkillResults(results, rep, () => showBattle({attacks, hp, startHP, mon, defeated, idx: b.idx, weak, rep}));
}
/* 공격 카드 만들기
   글자 카드: 스킬 데미지 × 하루 반복 비율 × (약점이면 3)
   합체 카드(단어): (단어 속 글자 데미지 합) × 합체 보너스 × 하루 반복 비율 × (약점 글자가 하나라도 있으면 3)
   모두 반올림, 가장 작게 1 */
function buildAttacks(m, p, rep, weak){
  const out = [], letters = [];
  m.items.forEach(it => {
    if (isWordItem(m, it)){
      const w = wordPower(it, p), wk = Array.from(it).some(c => weak.includes(c));
      out.push({kind:"word", w: it, combo: w.combo, base: w.dmg, weak: wk,
        hit: Math.max(1, Math.round(w.raw * w.combo * rep.dmg * (wk ? WEAK_MULT : 1)))});
    } else Array.from(it).forEach(c => { if (!letters.includes(c)) letters.push(c); });
  });
  letters.forEach(c => {
    const s = skillInfo(c, p), w = weak.includes(c);
    out.push({kind:"char", c, s, weak:w, hit: Math.max(1, Math.round(s.dmg * rep.dmg * (w ? WEAK_MULT : 1)))});
  });
  return out;
}

        : r.s.lv > r.lb ? `<div class="msg lv">⬆️ Lv.${r.lb} → Lv.${r.s.lv}<br><span class="note">데미지 ${DMG[r.lb]} → ${r.s.dmg}</span></div>`

/* 배틀 공격 카드: 글자 카드 또는 합체(단어) 카드. 실제로 들어갈 데미지를 보여 준다 */
function attackCardHTML(a, i, rep){
  const tired = rep !== REPEAT[0] ? `<div class="zz">💤</div>` : "";
  const weak = a.weak ? `<div class="wtag">🎯 약점 ×${WEAK_MULT}</div>` : "";
  if (a.kind === "word"){
    return `<div class="skill wordc ${a.weak ? "weakc" : ""}" data-atk="${i}">${weak}${tired}
      <div class="ch">${esc(a.w)}</div>
      <div class="lv">${a.combo > 1 ? `🔗 합체 ×${a.combo}` : "📝 낱말"}</div>
      <div class="dm">⚔️ ${a.hit}</div></div>`;
  }
  const g = GRADE[a.s.lv] || GRADE[1], hw = latestHandwriting(a.c);
  return `<div class="skill g${a.s.lv || 1} ${a.weak ? "weakc" : ""}" data-atk="${i}">${weak}${tired}
    ${hw ? `<img class="hw" src="${hw}" alt="">` : ""}
    <div class="ch">${esc(a.c)}</div>
    <div class="lv">${g.i} Lv.${a.s.lv}</div>
    <div class="dm">⚔️ ${a.hit}</div></div>`;
}
function showBattle(o){

    <h2>${esc(o.mon.n)}</h2>

    <div class="arena">
      ${dinoImg(o.mon, "angry", "mon", 'id="mon"')}

    </div>

    <p style="margin:14px 0 0" id="guide">${o.attacks.some(a => a.kind === "word") ? "합체 카드를 눌러서 공격해요!" : "스킬 카드를 눌러서 공격해요!"}</p>
    <div class="atk">${o.attacks.map((a,i) => attackCardHTML(a, i, o.rep)).join("")}</div>

    card.classList.add("used"); used++;

    const shout = [a.kind === "word" ? (a.combo > 1 ? `${a.w} 합체 공격!` : `${a.w} 공격!`) : "", a.weak ? "🎯 약점 공격!" : ""].filter(Boolean);

      const f = document.createElement("div"); f.className = "atkfx" + (a.weak ? " weak" : "");

    st.querySelector("#hptx").textContent = "HP " + hpNow + " / " + o.hp;
    if (hpNow <= 0 || used === o.attacks.length) setTimeout(() => finishBattle(hpNow <= 0), 900);

    if (win){

      const mon = st.querySelector("#mon");
      if (mon.tagName === "IMG") mon.src = o.mon.friendly;   // 친구가 되면 웃는 얼굴로 바뀐다

      const nx = dinoAt(o.idx + 1);
      const allDone = o.mon.k === FOES.length - 1;    // 40번째(관우)를 이겼다
      const groupDone = !allDone && lastOfGroup(o.mon.k); // 공룡 20번째, 로봇 10번째를 이겼다

      if (allDone){

    }
    // 다음에 할 약점 글자 미션 (이겼으면 새 상대의 약점)
    const nextWeak = (state.boss.weak || []).map(c => ({c, m: missionForChar(c)})).filter(x => x.m);
    if (nextWeak.length){
      after.innerHTML += `<div class="weaknext"><div>🎯 ${win ? "다음 상대의 약점 글자" : "약점 글자"}로 공격하면 데미지 ${WEAK_MULT}배!</div>
        <div class="row" style="justify-content:center;margin-top:6px">${nextWeak.map(x => `<button class="btn small blue" data-wm="${esc(x.m.id)}"><b style="font-family:'Noto Sans KR';font-size:22px">${esc(x.c)}</b>&nbsp;연습하기</button>`).join("")}</div></div>`;
    }
    after.innerHTML += `<div class="row" style="justify-content:center">
      <button class="btn ghost" data-c="skills">📖 스킬북</button>
      <button class="btn" data-c="home">🏠 홈으로</button></div>`;
    after.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { st.remove(); cur = null; tab = b.dataset.c; render(); });
    after.querySelectorAll("[data-wm]").forEach(b => b.onclick = () => { st.remove(); openMission(b.dataset.wm); });
  }
}

/* ================= 친구 도감 ================= */
function renderDinos(){
  const b = state.boss, h = b.idx, N = FOES.length;
  const lap = Math.floor(h / N), nowK = h % N;
  // 상대마다 친구가 된 횟수 (2회차부터는 같은 칸에 별이 늘어난다)
  const times = k => h > k ? Math.floor((h - k - 1) / N) + 1 : 0;
  const head = lap
    ? `<div style="font-size:22px">🏆 ${N}명 모두 친구! · 💪 ${lap+1}회차 친구 ${nowK}명</div>`
    : `<div style="font-size:22px">🏅 친구 도감 · 친구 ${h}명</div>`;
  let html = `<div class="card center">${head}
    <div class="note">미션을 끝내고 스킬로 공격해서 HP를 0으로 만들면 친구가 돼요. 친구가 된 상대를 누르면 크게 볼 수 있어요.</div></div>`;
  TYPE_ORDER.forEach(tk => {
    const ty = TYPES[tk];
    const ks = FOES.map((f, k) => k).filter(k => FOES[k].t === tk);
    const got = ks.filter(k => times(k) > 0).length;
    html += `<div class="sec-title">${ty.e} ${ty.group} <span class="note" style="font-size:16px">${got} / ${ks.length}</span></div><div class="dgrid">`;
    ks.forEach(k => {
      const t = times(k), stars = t > 1 ? " " + "⭐".repeat(Math.min(t, 5)) : "";
      if (k === nowK){
        const d = dinoAt(h), hp = bossHP(h);
        html += `<button class="dino now" data-dino="${h}">${dinoImg(d, "angry", "e")}<b>${esc(d.n)}</b><div class="bar hp" style="height:10px;margin:6px 8px"><i style="width:${(hp-b.dmg)/hp*100}%"></i></div><span class="note">HP ${hp-b.dmg}/${hp}</span></button>`;
      } else if (t){
        const d = dinoAt(k);
        html += `<button class="dino" data-dino="${k}">${dinoImg(d, "friendly", "e")}<b>${esc(d.n)}</b><span class="note">💛 친구${stars}</span></button>`;
      } else {
        html += `<button class="dino lock" data-dino="-1">${dinoImg(dinoAt(k), "friendly", "e")}<b>???</b><span class="note">HP ${bossHP(k)}</span></button>`;
      }
    });
    html += `</div>`;
  });
  $view.innerHTML = html;
  $view.querySelectorAll("[data-dino]").forEach(el => el.onclick = () => {
    const i = Number(el.dataset.dino);
    if (i < 0) return toast("아직 비밀이에요! 앞의 상대와 먼저 친구가 되어요.");
    openDino(i, times(i % N));
  });
}
function openDino(i, t){
  const d = dinoAt(i), b = state.boss, friend = i < b.idx;
  const hp = bossHP(i), left = hp - b.dmg;
  const bg = document.createElement("div"); bg.className = "modal-bg";
  const tag = friend ? `💛 내 친구${t > 1 ? " · ⭐ " + t + "번 친구가 됐어요" : ""}`
    : `⚔️ 지금 만나고 있는 ${d.ty.name}${t ? " · 💛 예전에 " + t + "번 친구가 됐어요" : ""}`;
  bg.innerHTML = `<div class="modal dmodal">
    ${dinoImg(d, friend ? "friendly" : "angry", "big")}
    <h3>${esc(d.n)}</h3>
    <div class="note" style="margin-bottom:8px">${lapLabel(d)} · ${tag}</div>
    <p class="ddesc">${esc(d.d)}</p>
    ${friend ? "" : `<div class="bar hp"><i style="width:${Math.max(0,left/hp*100)}%"></i></div>
      <p class="note">HP ${left} / ${hp} · 미션을 끝내고 스킬로 공격하면 친구가 돼요!</p>`}
    <button class="btn ghost small" data-x style="margin-top:12px">닫기</button>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-x]")) bg.remove(); });
}

  document.getElementById("backupBtn").onclick = async () => {
    state.lastBackup = Date.now(); await persist();
    const d = new Date(), stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
    const data = JSON.stringify({app:"geulssi-gw", version:1, savedAt: Date.now(), state, records});
    const ok = await saveFile(new Blob([data], {type:"application/json"}), "글씨탐험대_백업_" + stamp + ".json");
    if (ok){ toast("백업 파일을 만들었어요. 파일 앱이나 구글 드라이브에 보관해 두세요."); renderParent(); }
  };
  document.getElementById("restoreIn").onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    let data = null;
    try{ data = JSON.parse(await f.text()); }catch(_){}
    if (!data || data.app !== "geulssi-gw" || !data.state || !Array.isArray(data.records)){ toast("글씨 탐험대 백업 파일이 아니에요."); return; }
    const when = data.savedAt ? fmtDate(data.savedAt) : "알 수 없는 날짜";
    if (!(await confirmBox("백업에서 되살리기", `${when}에 만든 백업으로 바꿀까요? 지금 이 태블릿의 기록은 백업 내용으로 바뀌어요.`, "되살리기"))) return;
    try{
      await chain;
      state = Object.assign({name:"", done:{}, custom:[], events:0, boss:{idx:0, dmg:0}}, data.state);
      if (!state.boss) state.boss = {idx:0, dmg:0};
      migrateSplit();   // 예전 백업이면 낱말 미션 나누기 옮기기를 여기서 한다
      records = data.records.slice().sort((a,b) => b.at - a.at);
      await Store.replaceAll(JSON.parse(JSON.stringify(state)), records);
      renderHeader(); toast("백업에서 되살렸어요!"); renderParent();
    }catch(_){ toast("되살리지 못했어요. 다른 백업 파일로 해 볼까요?"); }
  };
  document.getElementById("wipeBtn").onclick = async () => {
    if (!(await confirmBox("⚠️ 완전 초기화", "이름, 우리집 미션, 비밀번호를 포함한 모든 것이 지워지고 되돌릴 수 없어요. 정말 처음으로 돌아갈까요?", "처음으로 되돌리기"))) return;
    if (!(await parentGate("완전 초기화를 하려면 비밀번호를 한 번 더 입력해 주세요."))) return;
    try{ await chain; await Store.resetAll(); }
    catch(_){ toast("일부 기록을 지우지 못했어요. 잠시 후 다시 해 주세요."); return; }
    state = {name:"", done:{}, custom:[], events:0, split: 2, boss:{idx:0, dmg:0}};
    records = []; parentOpen = false; cur = null;
    renderHeader(); tab = "home"; render();
    toast("처음 상태로 되돌렸어요. 다음 어른 확인 때 새 비밀번호를 만들어요.");
  };
  document.getElementById("resetBtn").onclick = async () => {
    if (!(await confirmBox("모든 기록 지우기", "완료한 미션, 스킬, 친구 도감, 글씨 사진이 모두 지워지고 되돌릴 수 없어요.", "모두 지우기"))) return;
    try{ await chain; await Store.resetAll(); }catch(_){ toast("일부 기록을 지우지 못했어요."); }
    state = {name: state.name, pinHash: state.pinHash, reps: state.reps, repsChar: state.repsChar, repsWord: state.repsWord, split: 2, done:{}, custom: state.custom||[], events:0, boss:{idx:0, dmg:0}}; records = [];
    persist(); toast("기록을 모두 지웠어요."); renderParent();
  };
}

/* ================= 라우팅 ================= */
function renderHeader(){
  document.getElementById("hello").textContent = state.name ? "✏️ " + state.name + "의 글씨 탐험대" : "✏️ 글씨 탐험대";
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab || (tab==="play" && b.dataset.t==="missions")));
  if (tab !== "parent"){ parentOpen = false; parentView = null; }
  if (tab === "home") renderHome();
  else if (tab === "missions") renderMissions();
  else if (tab === "play" && cur) renderPlay();
  else if (tab === "skills") renderSkills();
  else if (tab === "dinos") renderDinos();
  else if (tab === "parent") renderParent();
  else { tab = "home"; renderHome(); }
  window.scrollTo(0,0);
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  cur = null; missionGroup = null; tab = b.dataset.t; render();
});
$view.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o){ openMission(o.dataset.open); return; }
  const s = e.target.closest("[data-skill]"); if (s){ openSkill(s.dataset.skill); return; }
  const g = e.target.closest("[data-go]"); if (g){ cur = null; tab = g.dataset.go; render(); }
});

/* ================= 시작 ================= */
(async () => {
  const {s, r} = await Store.init();
  if (s) state = Object.assign({name:"", done:{}, custom:[], events:0, boss:{idx:0, dmg:0}}, s);
  if (!state.boss) state.boss = {idx:0, dmg:0};
  if (migrateSplit()) persist();   // 예전 기록이면 한 번만 옮긴다
  records = Array.isArray(r) ? r.sort((a,b) => b.at - a.at) : [];
  setBadge(); renderHeader(); render();
})();
window.addEventListener("online", setBadge); window.addEventListener("offline", setBadge);
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
})();
</script>
</body>
</html>
